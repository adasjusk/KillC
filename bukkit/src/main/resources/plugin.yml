name: KillC
version: '${version}'
main: com.adasjusk.killc.bukkit.KillCBukkit
author: adasjusk
api-version: '${api_version}'
folia-supported: true
description: Kill commands with configurable options. Works on Paper, Folia and Velocity.

permissions:
  killc.self:
    description: Allows using basic kill commands on yourself
    default: true
  killc.others:
    description: Allows killing other players
    default: op
  killc.selector:
    description: Allows using selectors like @e[type=...] (restricted to operators by default).
    default: op
  killc.reload:
    description: Allows reloading the plugin configuration
    default: op
  killc.*:
    description: Gives access to all KillC commands
    default: op
    children:
      killc.self: true
      killc.others: true
      killc.selector: true
      killc.reload: true
